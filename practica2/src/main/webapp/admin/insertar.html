<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Insertar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="admin-insertar">

    <mi-cabecera-admin></mi-cabecera-admin>

    <div class="container mt-5">
        <h2 class="text-center">Insertar Nuevo Producto</h2>
        
        <form>
            <table class="table table-bordered text-center mt-4">
                <thead class="table-dark">
                    <tr>
                        <th>Categoría</th>
                        <th>Imagen</th>
                        <th>Descripción</th>
                        <th>Precio (€)</th>
                        <th>Existencias</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <select class="form-select">
                                <option>Partes de Arriba</option>
                                <option>Partes de Abajo</option>
                                <option>Accesorios</option>
                            </select>
                        </td>
                        <td>
                            <input type="file" class="form-control">
                        </td>
                        <td><input type="text" class="form-control"></td>
                        <td><input type="number" class="form-control" step="0.01"></td>
                        <td><input type="number" class="form-control"></td>
                    </tr>
                </tbody>
            </table>
        </form>

        <div class="mt-3">
            <button class="btn btn-principal" onclick="alert('Producto añadido'); window.location.href='productos.html';">Insertar</button>
            <button class="btn btn-principal" onclick="window.location.href='productos.html';">Volver</button>
        </div>
    </div>

    <mi-pie-admin></mi-pie-admin>
    <script src="./js/mis-etiquetas.js"></script>
</body>
</html>
