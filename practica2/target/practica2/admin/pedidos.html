<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="admin-pedidos">

    <mi-cabecera-admin></mi-cabecera-admin>

    <div class="container mt-5">
        <h2 class="text-center">Gestión de Pedidos</h2>

        <table class="table table-bordered mt-4 text-center">
            <thead class="table-dark">
                <tr>
                    <th>Pedido #</th>
                    <th>Usuario</th>
                    <th>Producto</th>
                    <th>Fecha del Pedido</th>
                    <th>Importe Total (€)</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Maurizio</td>
                    <td>LuxutyETSE tee</td>
                    <td>05/01/2025</td>
                    <td>99,99€</td>
                    <td>
                        <select class="form-select" onchange="alert('Estado del pedido actualizado')">
                            <option>Entregado</option>
                            <option>Pendiente</option>
                            <option>Enviado</option>
                            <option>Cancelado</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>NAcho</td>
                    <td>LuxuryETSE cargo pants</td>
                    <td>17/01/2026</td>
                    <td>230,50€</td>
                    <td>
                        <select class="form-select" onchange="alert('Estado del pedido actualizado')">
                            <option>Cancelado</option>
                            <option>Pendiente</option>
                            <option>Enviado</option>
                            <option>Entregado</option>
                        </select>
                    </td>
                </tr>
                
            </tbody>
        </table>

        <h4 class="mt-4">Filtrar Pedidos</h4>
        <div class="row mb-4">
            <div class="col-md-2">
                <label for="usuario" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="usuario">
            </div>
            <div class="col-md-2">
                <label for="producto" class="form-label">Producto</label>
                <input type="text" class="form-control" id="producto">
            </div>
            <div class="col-md-2">
                <label for="fechaIgual" class="form-label">Fecha (igual)</label>
                <input type="date" class="form-control" id="fechaIgual">
            </div>
            <div class="col-md-2">
                <label for="fechaMenorIgual" class="form-label">Fecha (≤)</label>
                <input type="date" class="form-control" id="fechaMenorIgual">
            </div>
            <div class="col-md-2">
                <label for="fechaMayorIgual" class="form-label">Fecha (≥)</label>
                <input type="date" class="form-control" id="fechaMayorIgual">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-principal w-100" onclick="alert('Búsqueda filtrada')">Filtrar</button>
            </div>
        </div>
    </div>

    <mi-pie-admin></mi-pie-admin>
    <script src="./js/mis-etiquetas.js"></script>
</body>
</html>
