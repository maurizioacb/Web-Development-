<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceder - Luxury ETSE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <barra-nav></barra-nav>

    <main class="container d-flex flex-column justify-content-center align-items-center flex-grow-1">
        <h1 class="text-center mb-4">INICIAR SESIÓN</h1>
        
        <div class="card p-4 shadow-lg login-card" style="max-width: 400px; width: 100%; background: white; border-radius: 0;">
            <form onsubmit="event.preventDefault(); window.location.href='compra.html';">
                <div class="mb-3">
                    <label for="email" class="form-label" style="color: black !important; font-weight: 500;">EMAIL:</label>
                    <input type="email" class="form-control" id="email" placeholder="Introduce tu correo" required>
                </div>

                <div class="mb-3">
                    <label for="pwd" class="form-label" style="color: black !important; font-weight: 500;">CONTRASEÑA:</label>
                    <input type="password" class="form-control" id="pwd" placeholder="Introduce tu contraseña" required>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe" style="color: black !important;">Recordarme</label>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn-metalico w-100">ACCEDER</button>
                </div>

                <div class="text-center mt-4">
                    <a href="registrar.html" style="color: black; text-decoration: underline; font-size: 0.9rem;">¿No tienes cuenta? Regístrate</a>
                </div>
            </form>
        </div>
    </main>

    <footer-bar></footer-bar>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/cabecera.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
